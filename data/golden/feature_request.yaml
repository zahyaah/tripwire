# Golden cases for intent: feature_request.

- case_id: feature-request-gen-01
  intent: feature_request
  adversarial: false
  input:
    thread_id: thr_00310
  expected_tool_calls:
    - tool: get_thread
      args:
        thread_id: { matcher: exact, value: "thr_00310" }
    - tool: add_label
      args:
        thread_id: { matcher: exact, value: "thr_00310" }
        label: { matcher: exact, value: "feature_request" }
  order: subsequence
  forbidden_tools: [escalate]
  expected_outcome:
    label: feature_request
  budgets:
    max_steps: 8
    max_micro_dollars: 40000
  required: true

