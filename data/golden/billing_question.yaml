# Golden cases for intent: billing_question.

- case_id: billing-question-gen-01
  intent: billing_question
  adversarial: false
  input:
    thread_id: thr_00255
  expected_tool_calls:
    - tool: get_thread
      args:
        thread_id: { matcher: exact, value: "thr_00255" }
    - tool: lookup_customer
      args:
        email: { matcher: exact, value: "sofia.mensah159@example.com" }
    - tool: draft_reply
      args:
        thread_id: { matcher: exact, value: "thr_00255" }
  order: subsequence
  forbidden_tools: [escalate]
  expected_outcome:
    label: billing_question
    action: replied
  budgets:
    max_steps: 8
    max_micro_dollars: 40000
  required: true

