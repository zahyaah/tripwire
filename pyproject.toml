[project]
name = "tripwire"
version = "0.1.0"
description = "Agent evaluation and observability harness"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "openai>=1.54",
    "pydantic>=2.9",
    "typer>=0.12",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.9",
]

[project.scripts]
tripwire = "tripwire.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tripwire"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option(...)/typer.Argument(...) as an argument default is the documented Typer idiom
# (the call is inspected by Typer at decoration time, not re-evaluated per call), not the
# mutable-default footgun B008 exists to catch.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tripwire"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tripwire.*"
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "regression: golden-set regression cases, run in replay mode",
]
addopts = "-ra"

[tool.coverage.run]
source = ["src/tripwire"]
